<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Genz Chama - Full Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            padding: 16px;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .login-box input,
        .login-box select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 14px;
        }

        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e2e8f0;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #1a4d3e;
            color: white;
        }

        .signup-form {
            background: #f3e8ff;
            border: 1px solid #8b5cf6;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        /* ========== HEADER WITH HAMBURGER ========== */
        .header {
            background: white;
            border-radius: 20px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* HAMBURGER BUTTON - Hidden on desktop, visible on mobile */
        .hamburger-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 8px;
            color: #1a4d3e;
            display: none;
            /* Hidden on desktop */;
            line-height: 1;
        }

        .hamburger-btn:hover {
            transform: none;
        }

        .header h1 {
            color: #1a4d3e;
            font-size: 20px;
            white-space: nowrap;
        }

        .header .user-info {
            color: #64748b;
            font-size: 13px;
            text-align: right;
        }

        .header .user-info span {
            color: #1a4d3e;
            font-weight: 600;
        }

        .admin-badge {
            background: #1e40af;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            font-size: 11px;
        }

        /* ========== SIDEBAR - Desktop (always visible) ========== */
        .sidebar {
            width: 200px;
            min-width: 170px;
            background: white;
            border-radius: 20px;
            padding: 16px 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            height: fit-content;
            flex-shrink: 0;
        }

        .sidebar .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 12px 6px 12px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 13px;
            color: #334155;
            margin-bottom: 2px;
        }

        .sidebar-item:hover {
            background: #f1f5f9;
        }

        .sidebar-item.active {
            background: #1a4d3e;
            color: white;
        }

        .sidebar-item .icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        .sidebar-logout {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .sidebar-logout .sidebar-item {
            color: #dc2626;
        }

        .sidebar-logout .sidebar-item:hover {
            background: #fee2e2;
        }

        /* ========== SIDEBAR - Mobile (slides in from left) ========== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        .sidebar-mobile {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: white;
            z-index: 1000;
            padding: 20px 16px;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            transition: left 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-mobile.open {
            left: 0;
        }

        .sidebar-mobile .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
            float: right;
            padding: 0 4px;
        }

        .sidebar-mobile .sidebar-item {
            font-size: 15px;
            padding: 14px 12px;
        }

        .sidebar-mobile .section-title {
            font-size: 12px;
            margin-top: 20px;
        }

        /* ========== CONTENT AREA ========== */
        .content-area {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            min-height: 400px;
            min-width: 0;
            overflow-x: auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .content-area h2 {
            font-size: 18px;
            margin-bottom: 16px;
            border-left: 4px solid #1a4d3e;
            padding-left: 12px;
            color: #1a4d3e;
        }

        /* ========== DASHBOARD CONTAINER ========== */
        .dashboard-container {
            display: flex;
            gap: 20px;
            min-height: 500px;
            margin-top: 16px;
            position: relative;
        }

        /* ========== MOBILE RESPONSIVE ========== */
        @media (max-width: 768px) {
            /* Show hamburger on mobile */
            .hamburger-btn {
                display: block !important;
            }

            /* Hide desktop sidebar on mobile */
            .sidebar {
                display: none !important;
            }

            .dashboard-container {
                flex-direction: column;
                gap: 12px;
                margin-top: 12px;
            }

            .content-area {
                padding: 16px;
                min-height: 300px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .header h1 {
                font-size: 17px;
            }

            .stat-card h3 {
                font-size: 20px;
            }

            .card {
                padding: 12px;
                margin-bottom: 12px;
            }

            .member-row {
                font-size: 13px;
                padding: 8px 0;
            }

            input,
            select,
            textarea {
                font-size: 13px;
                padding: 8px 12px;
            }

            button {
                font-size: 12px;
                padding: 8px 14px;
                margin: 3px;
            }

            .content-area h2 {
                font-size: 16px;
                margin-bottom: 12px;
            }

            .flex-buttons {
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 14px;
            }

            .hamburger-btn {
                font-size: 24px;
            }

            .header .user-info {
                font-size: 11px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .stat-card {
                padding: 10px;
            }

            .stat-card h3 {
                font-size: 16px;
            }

            .stat-card p {
                font-size: 11px;
            }

            .content-area {
                padding: 12px;
            }

            .content-area h2 {
                font-size: 14px;
                padding-left: 8px;
            }

            .sidebar-mobile {
                width: 220px;
                padding: 16px 12px;
            }

            .sidebar-mobile .sidebar-item {
                font-size: 13px;
                padding: 12px 10px;
            }
        }

        /* ========== REST OF STYLES ========== */
        .card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 16px;
            color: #1a4d3e;
            margin-bottom: 10px;
        }

        button {
            background: #1a4d3e;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        button.secondary {
            background: #64748b;
        }
        button.sync {
            background: #0284c7;
        }
        button.danger {
            background: #dc2626;
        }
        button.delete-member {
            background: #dc2626;
            font-size: 11px;
            padding: 4px 10px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .total {
            text-align: center;
            margin: 12px 0;
            padding: 10px;
            background: #e6f7ed;
            border-radius: 40px;
            font-weight: bold;
        }

        .csv-url-box {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #0284c7;
        }

        .small-text {
            font-size: 11px;
            color: #64748b;
        }

        .flex-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-card h3 {
            font-size: 28px;
            color: #1a4d3e;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #64748b;
            font-size: 14px;
        }

        .winner {
            background: #d1fae5;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
        }

        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .footer span {
            color: #1a4d3e;
            font-weight: 500;
        }

        .login-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 24px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .warning-modal {
            background: #fee2e2;
            border: 2px solid #dc2626;
        }

        .error-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .error-modal .error-box {
            background: white;
            padding: 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .error-modal .error-box button {
            background: #1a4d3e;
            padding: 10px 20px;
            margin: 0;
        }

        .till-display {
            background: #1a4d3e;
            color: white;
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 12px;
        }

        .till-display h4 {
            font-size: 24px;
            letter-spacing: 2px;
        }

        .payment-form {
            background: #f0fdf4;
            border: 1px solid #00a86b;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .motivation-card {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
        }

        .motivation-text {
            font-size: 13px;
            color: #92400e;
            font-style: italic;
        }

        .interest-box {
            background: linear-gradient(135deg, #1a4d3e 0%, #0f3b2c 100%);
            color: white;
            border-radius: 20px;
            padding: 16px;
        }

        .interest-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .interest-row:last-child {
            border-bottom: none;
        }

        .savings-box {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            border-radius: 20px;
            padding: 16px;
        }

        .eligibility-info {
            background: #e0e7ff;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
            font-size: 12px;
        }

        .loan-detail {
            background: #f8fafc;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .sync-status {
            background: #e6f7ed;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            text-align: center;
            margin: 10px 0;
        }

        .member-csv-card,
        .sync-loans-card {
            border: 2px solid #8b5cf6;
            background: #faf5ff;
        }

        .member-csv-card h3,
        .sync-loans-card h3 {
            color: #6d28d9;
            margin-bottom: 10px;
        }

        .preset-links {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .btn-small {
            font-size: 11px;
            padding: 5px 10px
